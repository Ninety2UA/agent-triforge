# personas/manifest.toml — the one manifest for the persona home (KTD21, R14).
#
# Each personas/<name>.md is a prompt body with no frontmatter; this file is
# where its model, tools and turn budget live. Skills name a persona and
# dispatch_persona (scripts/lib/persona.sh) reads its entry here, so no skill
# restates a pin. scripts/validate-skills.sh checks that every persona file
# has an entry, every entry has a file, and every persona a skill names exists.
#
#   class            the tool class dispatch_persona enforces:
#                      read        Read, Grep, Glob
#                      read-web    read + WebFetch, WebSearch (Claude only)
#                      exec        Bash and no edit tools, in a disposable
#                                  worktree at the lease's collect snapshot
#                      lease       never run as a persona: the work goes
#                                  through a lease (it edits code)
#                      agent-team  Claude's agent_teams capability only, through
#                                  the Agent tool (tools unenforced)
#   tier             the starting rung on the model ladder, top first:
#                    top | opus-xhigh | opus-high | sonnet-high. The rungs are
#                    defined once, TRIFORGE_MODEL_LADDER in scripts/lib/registry.sh.
#   never_downgrade  true pins the persona to `top` on Claude whichever CLI
#                    leads; true for exactly the trio the ladder names.
#   max_turns        the persona's turn budget.

[personas.architecture-strategist]
class = "read"
tier = "opus-xhigh"
never_downgrade = false
max_turns = 10


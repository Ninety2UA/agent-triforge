<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=512" />
<title>Agent Triforge README hero</title>
<script src="assets/gsap.min.js"></script>
<style>
/*{{DS_CSS}}*/
html, body { width: 1280px; height: 512px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1280" data-height="512">
  <div id="stage" class="clip" data-start="0" data-duration="10" data-track-index="0"><canvas id="cv"></canvas><div id="type"></div></div>
</div>
<script>
//{{DS_JS}}
</script>
<script>
(function () {
  const H = HT;
  const { disc, block, join, track, renderer, tx, seg, frame, LOGO, spring, clamp, lerp, PINK, INK, EMPTY } = H;
  function build() {
    const D = 10;
    const tl = gsap.timeline({ paused: true });
    const R = renderer(document.getElementById("cv"), 1280, 512);
    const T = document.getElementById("type");

    // ---- the mark, marching: every dot steps one node along its branch, so
    // each step ends on the same shape (work flows into one line) ----
    const LP = 16, LX = 64, LY = 150;
    const nodes = [];
    const key = (x, y) => x + "," + y;
    const idx = {};
    const addN = (list, c) => list.forEach(([x, y, r]) => { idx[key(x, y)] = nodes.length; nodes.push({ x, y, r, c }); });
    addN(LOGO.up, INK); addN(LOGO.mid, INK); addN(LOGO.lo, INK); addN(LOGO.pk, PINK);
    const succ = { "0,-3": "1,-3", "1,-3": "2,-3", "2,-3": "3,-2", "1,-2": "2,-2", "2,-2": "3,-2", "3,-2": "4,-1", "4,-1": "5,0",
      "0,0": "1,0", "1,0": "2,0", "2,0": "3,0", "3,0": "4,0", "4,0": "5,0", "5,0": "6,0",
      "6,0": "7,0", "7,0": "8,0", "8,0": "9,0", "9,0": "10,0", "10,0": "11,0", "11,0": "exit" };
    ["0,-3", "1,-3", "2,-3", "1,-2", "2,-2", "3,-2", "4,-1"].forEach((k) => {
      const [x, y] = k.split(",").map(Number);
      const s = succ[k].split(",").map(Number);
      succ[x + "," + -y] = s[0] + "," + -s[1];
    });
    const hasPred = new Set(Object.values(succ));
    const PER = 2.5, MOVE = 0.95;
    const mark = { emit(t, out) {
      const s = Math.floor(t / PER + 1e-9), u = (t - s * PER) / MOVE;
      const p = spring(u);
      nodes.forEach((n) => {
        const k = key(n.x, n.y), sk = succ[k];
        const m = sk === "exit" ? { x: 12, y: 0, r: 0, c: PINK } : nodes[idx[sk]];
        const x = lerp(n.x, m.x, p), y = lerp(n.y, m.y, p), r = lerp(n.r, m.r, p);
        if (r * LP > 0.15) out.push(LX + x * LP, LY + y * LP, r * LP, p < 0.5 ? n.c : m.c);
        if (!hasPred.has(k) && n.r * p * LP > 0.15) out.push(LX + n.x * LP, LY + n.y * LP, n.r * p * LP, n.c);
      });
    } };

    // ---- a quiet dot field; three workspaces sit on the shared branch ----
    const RX = 560, RW = 720, RH = 512;
    const LINE_Y = 300;
    const cells = [{ x: 780 }, { x: 960 }, { x: 1140 }].map((c) => ({ x: c.x, y: 104, w: 132, h: 120 }));
    const smooth = (a, b, v) => { const u = clamp((v - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); };
    const field = block(RX + 8, 40, 45, 28, { pitch: 16, rf: (i, j) => {
      const x = RX + 8 + i * 16, y = 40 + j * 16;
      if (Math.abs(y - LINE_Y) < 14) return 0;
      for (const c of cells) if (x > c.x - c.w / 2 - 12 && x < c.x + c.w / 2 + 12 && y > c.y - 12 && y < c.y + c.h + 12) return 0;
      return 1.5 * smooth(RX, RX + 200, x);
    } });
    const fieldE = { emit(t, out) { for (let i = 0; i < field.n; i++) if (field.r[i] > 0.2) out.push(field.x[i], field.y[i], field.r[i], H.MUTED); } };

    // the shared branch flows right
    const LP2 = 14;
    const lineE = { emit(t, out) {
      const off = ((t / D) * LP2 * 10) % LP2;
      for (let x = RX + 40 - LP2 + off; x < 1290; x += LP2) {
        const g = smooth(RX + 30, RX + 160, x);
        if (g > 0.02) out.push(x, LINE_Y, 4.2 * g, INK);
      }
    } };
    const frames = join(...cells.map((c) => frame(c.x - c.w / 2, c.y, c.w, c.h, { pitch: 10, r: 1.5 })));
    const framesE = { emit(t, out) { for (let i = 0; i < frames.n; i++) out.push(frames.x[i], frames.y[i], frames.r[i], frames.c[i]); } };

    // three tasks, staggered: rise into the workspace, build, a cluster from
    // another agent (the accent) touches it, the work pours back onto the line
    const leases = cells.map((c, k) => {
      const t0 = 0.15 + k * 3.33;
      const cy = c.y + c.h / 2;
      const taskDot = (x, y) => disc(x, y, 9, { pitch: 100, rmax: 9, flat: true });
      const fillF = join(taskDot(c.x, cy), block(c.x - c.w / 2 + 12, c.y + 12, 11, 9, { pitch: 10, rf: (i, j) => {
        const d = Math.hypot(c.x - c.w / 2 + 12 + i * 10 - c.x, c.y + 12 + j * 10 - cy) / 80;
        return Math.max(0, 3.9 * (1 - d * d * 0.85));
      } }));
      const branch = seg(c.x, LINE_Y - 14, c.x, c.y + c.h + 8, { pitch: 10, r: 1.8 });
      const work = track([
        { t: 0, f: EMPTY },
        { t: t0, f: taskDot(c.x, LINE_Y), dur: 0.2, sweep: 0, jitter: 0 },
        { t: t0 + 0.12, f: taskDot(c.x, cy), mode: "index", dur: 0.55, sweep: 0, jitter: 0, bend: 0, shrink: 0 },
        { t: t0 + 0.6, f: fillF, dur: 0.6, sweep: 0.15, jitter: 0.1, dir: [0, -1] },
        { t: t0 + 1.9, f: seg(c.x - 42, LINE_Y, c.x + 42, LINE_Y, { pitch: 14, r: 5.2, c: INK }), dur: 0.55, sweep: 0.15, jitter: 0.06, dir: [0, 1], shrink: 0.7, bend: 0.03 },
        { t: t0 + 2.55, f: EMPTY, dur: 0.45, sweep: 0, jitter: 0.05, shrink: 0 },
      ]);
      const br = track([
        { t: 0, f: EMPTY },
        { t: t0 + 0.05, f: branch, dur: 0.35, sweep: 0.25, jitter: 0, dir: [0, -1] },
        { t: t0 + 1.95, f: EMPTY, dur: 0.3, sweep: 0.2, jitter: 0, dir: [0, 1] },
      ]);
      const rv = (y) => disc(c.x + 30, y, 22, { pitch: 9, rmax: 3.9, c: PINK });
      const review = track([
        { t: 0, f: EMPTY },
        { t: t0 + 1.0, f: rv(-40), dur: 0.1, sweep: 0, jitter: 0 },
        { t: t0 + 1.05, f: rv(c.y + 4), mode: "index", dur: 0.45, sweep: 0.06, jitter: 0.04, bend: 0.03, dir: [0, 1] },
        { t: t0 + 1.55, f: rv(-40), mode: "index", dur: 0.5, sweep: 0.06, jitter: 0.04, bend: 0.03, dir: [0, -1] },
        { t: t0 + 2.0, f: EMPTY, dur: 0.1, sweep: 0, jitter: 0 },
      ]);
      return [br, work, review];
    }).flat();

    const E = [fieldE, framesE, lineE, ...leases, mark];
    H.drive(tl, D, (t) => R.draw(t, E));

    // ---- type ----
    tx(T, 56, 222, "Agent Triforge", "h1", 64);
    tx(T, 58, 302, "One agent leads. The others build, review and test, and nothing merges until a different agent has checked it.", "body wrap", 28, { width: "490px", lineHeight: "1.3" });
    window.__timelines["main"] = tl;
  }
  H.fontsReady().then(build);
})();
</script>
</body>
</html>

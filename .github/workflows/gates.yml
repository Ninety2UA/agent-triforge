# The PR gates (KTD15): shell syntax, both release-gate validators and their
# fixture self-tests, and the SELF-row gate, on every pull request to main or
# a release/ branch (release/4.0, release/4.1, ...). The site job builds the
# website in site/ and runs its gate and tests: the site is generated from the
# repo's skills, personas and docs, so a plugin change that breaks the build
# (a lead skill with no catalog group, a renamed heading another page links
# to) fails here instead of leaving production on its last good deploy.
#
# macOS runner on purpose: the hook handlers and helper libraries run under
# /bin/bash 3.2 (macOS), so every script runs under /bin/bash here. No live
# row runs — `probe-capabilities.sh --self-only` executes only the static
# SELF-* rows, writes its record to a scratch path (never the committed
# ops/research/ record), and exits 3 on any SELF FAIL. The can-fail job proves
# the gate can fail: it breaks one invariant in a scratch copy and requires
# exit 3. `claude plugin validate --strict` needs Claude Code and stays a
# local release gate (AGENTS.md "Checks to run" and "Release").
#
# Scope (the scope job): the SELF gate takes about 30 minutes on a hosted
# macOS runner, so it is skipped when every file a pull request changes lies
# where no SELF row reads: site/, docs/, README.md, LICENSE, the notes under
# ops/decisions/ and ops/solutions/, and validate-versions.sh with its
# fixtures, which the gates job runs itself (the rows build their own
# throwaway repos). Not on the list: ops/research/, because the Devin lane can
# fall back to the repo's newest probe record, and validate-skills.sh, which
# SELF-08b runs. Any other path runs it, renames count on both sides, and a
# scope that cannot be computed (a manual run, a failed diff) runs
# everything. The can-fail job runs in parallel, and only when the gate's own
# wiring changes: the probe harness, the pre-push hook SELF-09 breaks, or
# this file. The syntax check, the validators, their self-tests and the site
# job run on every pull request.
name: gates

on:
  pull_request:
    branches: [main, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      self: ${{ steps.scope.outputs.self }}
      canfail: ${{ steps.scope.outputs.canfail }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Which gates this change needs
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          self=true
          canfail=true
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ] && files=$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA"); then
            self=false
            canfail=false
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              case "$f" in
                site/*|docs/*|README.md|LICENSE|ops/decisions/*|ops/solutions/*|scripts/validate-versions.sh|scripts/fixtures/validate-versions/*) ;;
                *) self=true ;;
              esac
              case "$f" in
                scripts/probe-capabilities.sh|scripts/probe-self-tests.sh|scripts/lease-git-hooks/*|.github/workflows/gates.yml) canfail=true ;;
              esac
            done <<< "$files"
            printf 'changed files:\n%s\n' "$files"
          else
            echo "no pull request diff to read: running every gate"
          fi
          echo "SELF gate: $self; can-fail proof: $canfail"
          echo "self=$self" >> "$GITHUB_OUTPUT"
          echo "canfail=$canfail" >> "$GITHUB_OUTPUT"

  gates:
    needs: scope
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release tags: SELF-08b rebuilds a released skill copy for the legacy-stamp migration case

      - uses: actions/setup-python@v7 # v5 runs on the deprecated Node 20
        with:
          python-version: "3.12" # tomllib (3.11+): the roster, ledger and probe parsers

      - name: Tools
        run: |
          /bin/bash --version | head -1
          python3 --version
          git --version
          command -v timeout >/dev/null 2>&1 || command -v gtimeout >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install coreutils

      - name: Shell syntax (/bin/bash 3.2)
        run: |
          for f in scripts/*.sh scripts/lib/*.sh hooks/handlers/*.sh scripts/lease-git-hooks/pre-push site/scripts/ignore-build.sh site/motion/finish.sh; do
            /bin/bash -n "$f" || { echo "syntax error: $f"; exit 1; }
          done

      - name: validate-versions
        run: /bin/bash scripts/validate-versions.sh

      - name: validate-skills # warnings are errors by default (U23); --warn is the relaxed run
        run: /bin/bash scripts/validate-skills.sh

      - name: validate-skills self-test # every fixture under scripts/fixtures/validate-skills/, both modes (default and --warn)
        run: /bin/bash scripts/validate-skills.sh --self-test

      - name: validate-versions self-test # every fixture under scripts/fixtures/validate-versions/ plus the computed AGENTS.md budget and --only cases
        run: /bin/bash scripts/validate-versions.sh --self-test

      - name: SELF gate
        if: needs.scope.outputs.self == 'true'
        run: /bin/bash scripts/probe-capabilities.sh --self-only

  self-gate-can-fail:
    needs: scope
    if: needs.scope.outputs.canfail == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # as in the gates job

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tools
        run: |
          command -v timeout >/dev/null 2>&1 || command -v gtimeout >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install coreutils

      - name: SELF gate can fail
        run: |
          set -u
          BROKEN="$RUNNER_TEMP/broken"
          mkdir -p "$BROKEN"
          git ls-files -z | tar --null -T - -cf - | tar -xf - -C "$BROKEN"   # one archive whatever the file count (xargs would split past ARG_MAX)
          rm "$BROKEN/scripts/lease-git-hooks/pre-push"   # SELF-09's no-push hook
          RC=0
          /bin/bash "$BROKEN/scripts/probe-capabilities.sh" --self-only 2> "$RUNNER_TEMP/broken.err" || RC=$?
          grep -E 'SELF GATE FAILED' "$RUNNER_TEMP/broken.err" || true
          if [ "$RC" -ne 3 ] || ! grep -q 'SELF GATE FAILED — .*SELF-09' "$RUNNER_TEMP/broken.err"; then
            echo "expected exit 3 naming SELF-09 from a tree without the pre-push hook; got rc=$RC"
            exit 1
          fi
          echo "gate fails as designed (rc=$RC, SELF-09 named)"

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm ci

      - name: Type-check the site
        run: npx astro check

      - name: Build the site and run the site gate
        run: npm run build

      # The quoted glob: the bare folder form fails on Node 22 and later.
      - name: Site tests
        working-directory: .
        run: node --test 'site/test/**/*.test.mjs'

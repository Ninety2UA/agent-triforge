# ops/roster.toml — Agent Triforge roster: who does what (KTD-2).
#
# One config file decides which CLI + model + effort handles each role, for
# every adapter. Roles ARE the task types — builder, reviewer, tester,
# analyst, documenter — so choosing model and effort per task type is this
# file's native grain.
#
# ANY adapter may read this file: it is deliberately CLI-neutral (ops/-level,
# not .claude/-scoped) and parsed with python3 tomllib — the same pattern as
# codex-agents/agents.toml — so non-Claude adapters can read their own role.
#
# Override semantics: any field left unset inherits the shipped default
# (the role table in scripts/lib/roster.sh plus the per-CLI registry in
# scripts/lib/registry.sh — deleting this file entirely is safe). A role
# overriding only `effort` keeps the default cli + model. The shipped posture
# is the builder pool: Claude leads builds, Codex reviews and tests,
# Antigravity analyzes and documents, and validated fallback chains degrade
# gracefully when a member is absent.
#
# Fallback chains ([cli] + fallbacks, walked in order) are validated at load:
# each chain must terminate at a core-trio member (claude, antigravity,
# codex), and the core trio cannot be disabled.
#
# Guided editing: at-setup walks member enrollment AND role assignment (accept
# the shipped defaults or customize per role) — `at-setup roles` jumps straight
# to the role step. Guided role writes go through roster_write_role, which
# enforces the load rules above before every write; hand-editing this file
# stays valid too.
#
# Model pins — shipped defaults; a role's `model` entry here overrides them:
#   - Antigravity (agy) pins the NEWEST Gemini model at its highest thinking
#     level, Pro or Flash (policy D-022, user-directed 2026-09-11): currently
#     "Gemini 3.8 Flash (High)" (AGY-05 PASS 2026-09-11). Set `model` on an
#     agy-backed role to run another variant when you explicitly want it —
#     e.g. model = "Gemini 3.1 Pro (High)" (the current Pro line, still the
#     newest Pro; opt-in) or "Gemini 3.8 Flash (Medium)". The
#     (Low)/(Medium)/(High) suffix IS agy's thinking-effort control, so for
#     agy the `effort` field maps into the model-variant suffix (low -> Low,
#     medium -> Medium, high/xhigh/max -> High; families without a (Medium)
#     variant, such as 3.1 Pro, map medium to (Low)). `agy models` prints the
#     live catalog.
#   - Codex pins gpt-6-astra at xhigh (D-021; CDX-03 PASS 2026-09-11). A role
#     can run another Codex model, e.g. model = "gpt-6.1-sol" (the newest
#     workhorse, close to Astra at lower cost; it answered on codex 0.160.0
#     and was refused on 0.155.1),
#     "gpt-6-sol" or "gpt-6-luna". Codex's /model picker lists the catalog.
#   - Cursor pins cursor-grok-4.6-xhigh explicitly — the shipped defaults never
#     select the Auto router. Cursor's effort control is the model-id SUFFIX
#     (cursor-grok-4.6-low|medium|high|xhigh — D-025, CUR-12), so `effort`
#     maps into that suffix (xhigh/max -> -xhigh); a bare family name such as
#     grok-4.6 is composed into the suffixed id by the roster writer.

[roles.builder]
cli = "claude"
# model is intentionally empty: the shell `claude -p` builder lease lane runs the
# host's default Claude Code model (no --model pin), so the roster has no model to
# carry here. The Fable/downgrade ladder applies to Agent-tool subagent spawns
# (the Agent tool's `model` parameter), not this shell lease lane.
model = ""
effort = "max"
fallbacks = ["codex", "antigravity"]

[roles.reviewer]
cli = "codex"
model = "gpt-6-astra"
effort = "xhigh"
fallbacks = ["antigravity", "claude"]

[roles.tester]
cli = "codex"
model = "gpt-6-astra"
effort = "xhigh"
fallbacks = ["claude"]

[roles.analyst]
cli = "antigravity"
model = "Gemini 3.8 Flash (High)"   # (High) suffix = agy effort control (see header)
effort = "high"
fallbacks = ["claude"]

[roles.documenter]
cli = "antigravity"
model = "Gemini 3.8 Flash (High)"   # (High) suffix = agy effort control (see header)
effort = "high"
fallbacks = ["claude"]

# --- Lead --------------------------------------------------------------------
# [lead] names the CLI that leads this checkout. The lead plans the work, runs
# the leases, reviews and merges. Claude Code or Codex can lead; with no [lead]
# table, Claude Code leads. The lease and roster helpers refuse to run under
# the other CLI. Switch from either CLI with `at-setup lead`, or with
# `roster_write_lead <cli>` from scripts/invoke-external.sh. The switch refuses
# while leases are open; --force hands them to the new lead without spending a
# requeue.
#
# To make Codex the lead, uncomment:
# [lead]
# cli = "codex"          # claude | codex
# model = "gpt-6-astra"  # left out: the CLI's shipped pin (claude: your session's model)
# effort = "xhigh"       # left out: xhigh for codex, your session's setting for claude

# --- Optional members --------------------------------------------------------
# Optional members (opencode, kimi, cursor, devin, grok) are enrolled on first
# detection — the session-start enrollment trigger or at-setup writes their
# entries; devin only through at-setup, because it needs your consent first. They
# must NOT appear as live entries in this shipped template: an existing
# [members.<cli>] entry is exactly what suppresses the enrollment ask, and a
# decline persists as `enabled = false` (disabled = absent everywhere — the
# member is skipped in every fallback chain; re-enabling is the flag flip
# alone, nothing else to restore).
#
# Example — uncomment and adjust, or let enrollment write it:
# [members.opencode]
# enabled = true
# model = "openrouter/z-ai/glm-5.3"   # shipped default; validated against the live OpenRouter list at enrollment
# enrolled = "2026-09-11"
#
# Shipped defaults for the other optional members, same shape:
# [members.kimi]   -> enabled = true, model = "kimi-code/k3"          (the OAuth-managed alias; `kimi login` provisions it)
# [members.cursor] -> enabled = true, model = "cursor-grok-4.6-xhigh"  (explicit suffixed pin — NEVER the Auto router)
# [members.devin]  -> enabled = true, model = "swe-1-6-slow", consent = "user <UTC time> via=<origin>"
#   Devin CLI sends prompts and code to Cognition, so it is enrolled only with your
#   consent on record (at-setup asks and writes it; a table without it fails to load).
#   It reviews and analyzes by default. It builds only after you opt in:
#   opt_in = ["builder"] (roster_write_member devin true <model> --opt-in builder).
# [members.grok]   -> enabled = true, model = "grok-4.7"               (effort rides in --effort; `grok login` or XAI_API_KEY)

[promotion]
# KTD-5 user gate: when true, the lead pauses at wave end for explicit user
# approval before promoting the sprint integration branch to main. Diffs that
# touch protected paths force the approval on regardless of this setting —
# enforced by the wave protocol, not by this file.
require_user_approval = false
